# Push to main → unit tests → wrangler deploy (Worker + public/ assets).
# Requires repo secret CLOUDFLARE_API_TOKEN (Workers Scripts Edit).
# Worker secrets (OPENROUTER_API_KEY, etc.) stay in Cloudflare — not in GitHub.

name: Deploy

# Cutover 2026-08-03: deploys moved to GitLab CI (.gitlab-ci.yml). This
# workflow no longer triggers on push, so it cannot double-deploy alongside
# GitLab. It stays available as a manual fallback (workflow_dispatch) until
# GitLab CI has proven itself, at which point it can be removed.
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    name: Unit tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unit tests
        run: node scripts/run-tests.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    name: Deploy Worker
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
          wranglerVersion: '4'
