name = "truerank"
main = "worker/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
routes = [
  { pattern = "chrisputer.tech/*", zone_name = "chrisputer.tech" },
  { pattern = "www.chrisputer.tech/*", zone_name = "chrisputer.tech" },
  { pattern = "research.chrisputer.tech/*", zone_name = "chrisputer.tech" },
]

[assets]
directory = "./public"
binding = "ASSETS"
# Run the Worker first so it can inject a per-request CSP nonce into HTML.
run_worker_first = true

[triggers]
crons = ["*/10 * * * *"]

[limits]
cpu_ms = 300000

[vars]
ENVIRONMENT = "production"
RATE_LIMIT_MAX = "5"
RATE_LIMIT_WINDOW_SECONDS = "3600"
CACHE_TTL_SECONDS = "86400"
MONTHLY_BUDGET_USD = "60"
# Programmatic-SEO flywheel: max keyword research runs the cron will start per
# UTC day. The flywheel also stays dormant until SERPER_API_KEY is set.
FLYWHEEL_DAILY_MAX = "6"
# EXTERNAL_WORKER_ENABLED routes research processing. BOTH paths are HONEST now (the synth
# is the CF-side extraction engine in either case — see Phase 2 / handleComplete):
#   "false" (DEFAULT + SAFE ROLLBACK): the CF-side runEngine (SYNTH_ENGINE=extract below)
#           processes every job. Self-contained, no homelab dependency. Thinner gather.
#   "true"  (FORWARD CUTOVER, comprehensive): hands jobs to the off-CF "blackbox" worker,
#           which now GATHERS ONLY and posts raw sources; handleComplete synthesizes the
#           SAME honest extraction report CF-side. Richer 200+ source gather.
# ROLLBACK during an incident = set this to "false" (NOT "true"). Only set "true" AFTER the
# gather-only research-worker.mjs is deployed to the homelab AND this CF build (with the
# handleComplete gather-only branch) is live — else the worker posts sources an old CF can't
# synthesize and every off-CF run fails.
EXTERNAL_WORKER_ENABLED = "false"
# Synthesis engine: 'extract' = the deterministic, can't-fabricate ML engine + gated
# LLM con-selector (grounding 0.80 vs the LLM synth's 0.30 on real pages). Unset/any
# other value falls back to the kimi LLM synth.
SYNTH_ENGINE = "extract"
# METRICS_TOKEN is intentionally NOT in [vars] — it is a secret, set via
# `npx wrangler secret put METRICS_TOKEN`. /metrics returns 503 until it exists.
ADSENSE_PUBLISHER_ID = "pub-6952672558994325"
ADSENSE_SLOT_TOP = "2568816027"
ADSENSE_SLOT_MID = "8942652687"
ADSENSE_SLOT_BOTTOM = "7765302384"
AMAZON_AFFILIATE_TAG = "battlesheep0a-20"
CF_ANALYTICS_TOKEN = "ea97bb136135401584c3547bd0d73b66"
# IndexNow verification key. Intentionally public — the protocol requires it to
# be hosted at https://chrisputer.tech/<key>.txt (served by the worker route).
INDEXNOW_KEY = "2b049a04674b366dc9b485b792ad823e"
# (GOOGLE_CSE_ID removed 2026-06-16: the /find Programmable Search Engine widget
# was retired — /find now 302-redirects to a plain Google search, so the CSE id
# is dead config. No code reads env.GOOGLE_CSE_ID.)

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "truerank-db"
database_id = "d02b3826-a46a-4821-8f3a-6e3a80407155"

# KV Namespace
[[kv_namespaces]]
binding = "KV"
id = "e4ac5aa9e3514eb58612b5c79956bf51"

# Queue Producer
[[queues.producers]]
binding = "RESEARCH_QUEUE"
queue = "truerank-research"

# Queue Consumer
[[queues.consumers]]
queue = "truerank-research"
max_batch_size = 1
max_retries = 2
dead_letter_queue = "truerank-dlq"

# Secrets (set via wrangler secret put):
# OPENROUTER_API_KEY  — paid OpenRouter key (planner/synth/classifier models)
# SERPER_API_KEY      — Serper.dev Google Search (web + news providers)
# AMAZON_ASSOCIATE_TAG — optional; AMAZON_AFFILIATE_TAG in [vars] is the default
