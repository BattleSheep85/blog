name = "truerank"
main = "worker/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

[vars]
ENVIRONMENT = "production"
RATE_LIMIT_MAX = "5"
RATE_LIMIT_WINDOW_SECONDS = "3600"
CACHE_TTL_SECONDS = "86400"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "truerank-db"
database_id = "d02b3826-a46a-4821-8f3a-6e3a80407155"

# KV Namespace
[[kv_namespaces]]
binding = "KV"
id = "e4ac5aa9e3514eb58612b5c79956bf51"

# Queue Producer
[[queues.producers]]
binding = "RESEARCH_QUEUE"
queue = "truerank-research"

# Queue Consumer
[[queues.consumers]]
queue = "truerank-research"
max_batch_size = 1
max_retries = 2
dead_letter_queue = "truerank-dlq"

# Secrets (set via wrangler secret put):
# OPENROUTER_API_KEY  — free tier, no credit card needed
# SERPER_API_KEY      — optional, 2500 free Google searches
# AMAZON_ASSOCIATE_TAG
