# Push to main -> unit tests -> wrangler deploy (Worker + public/ assets).
# Requires masked, protected CI/CD variable CLOUDFLARE_API_TOKEN
# (Workers Scripts Edit). Worker secrets (OPENROUTER_API_KEY, etc.) stay in
# Cloudflare, not in GitLab.

image: node:22

stages:
  - test
  - deploy

unit_tests:
  stage: test
  script:
    - node scripts/run-tests.mjs

deploy_worker:
  stage: deploy
  needs:
    - unit_tests
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - npx wrangler@4 deploy
