baseURL = "https://chrisputer.tech/"
languageCode = "en-us"
title = "Chris's Tech Notes"
theme = "PaperMod"

paginate = 10
enableRobotsTXT = true
buildDrafts = false

[params]
  env = "production"
  description = "Linux sysadmin notes, fixes, and guides — mostly CachyOS, KDE Plasma, and self-hosting"
  author = "Chrisputer"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true

  [params.homeInfoParams]
    Title = "Hey there"
    Content = "Linux sysadmin stuff — fixes, guides, and notes from running CachyOS as a daily driver."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/BattleSheep85"

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

[params.label]
  text = "Chrisputer"

[params.assets]
  disableHLJS = true
  theme_color = "#1a1a2e"
  msapplication_TileColor = "#1a1a2e"

[[menu.main]]
  name = "Home"
  url = "/"
  weight = 1

[[menu.main]]
  name = "Archives"
  url = "/archives/"
  weight = 5

[[menu.main]]
  name = "Tags"
  url = "/tags/"
  weight = 10

[[menu.main]]
  name = "Search"
  url = "/search/"
  weight = 15

[markup]
  [markup.highlight]
    style = "dracula"
    lineNos = false
    codeFences = true
    guessSyntax = true

  [markup.goldmark.renderer]
    unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[taxonomies]
  tag = "tags"
  category = "categories"
