baseURL = "https://chrisputer.tech/"
languageCode = "en-us"
title = "Chrisputer | Wichita IT Consulting & Network Support"
theme = "PaperMod"

paginate = 10
enableRobotsTXT = true
buildDrafts = false

[params]
  env = "production"
  description = "Local IT consulting for small businesses in Wichita, KS. Network assessments, firewall audits, Wi-Fi deployments, cybersecurity, and ongoing IT support."
  author = "Chris"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  images = ["/images/og-default.png"]

  [params.homeInfoParams]
    Title = "Local IT help for Wichita small businesses"
    Content = """Network assessments, firewall audits, Wi-Fi fixes, cybersecurity guidance, and hands-on IT support. \
I'm a network engineer who helps small businesses in the Wichita area get their IT right — no contracts, no call center, just straightforward help from someone who does this for a living."""

  [[params.socialIcons]]
    name = "email"
    url = "mailto:chris@chrisputer.tech"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/BattleSheep85"

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

[params.label]
  text = "Chrisputer"

[params.assets]
  disableHLJS = true
  theme_color = "#1a1a2e"
  msapplication_TileColor = "#1a1a2e"

[[menu.main]]
  name = "Home"
  url = "/"
  weight = 1

[[menu.main]]
  name = "Services"
  url = "/services/"
  weight = 3

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 5

[[menu.main]]
  name = "Blog"
  url = "/posts/"
  weight = 7

[[menu.main]]
  name = "Search"
  url = "/search/"
  weight = 15

[markup]
  [markup.highlight]
    style = "dracula"
    lineNos = false
    codeFences = true
    guessSyntax = true

  [markup.goldmark.renderer]
    unsafe = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[taxonomies]
  tag = "tags"
  category = "categories"
